<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 650" role="img" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <title>FindDogBreed 코드 아키텍처</title>
  <desc>main.py가 cli.py를 통해 commands.py를 호출하고, commands가 pipeline과 evaluate를 사용하며, 그 아래 5개 단계 구현 모듈과 utils/crop.py, 호환용 model.py가 있는 계층 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- CLI 계층 (보라) -->
  <g>
    <rect x="270" y="20" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="340" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">main.py</text>
    <text x="340" y="62" text-anchor="middle" font-size="12" fill="#534AB7">실행 시작점</text>
  </g>
  <path d="M340 76 L340 96 L175 96 L175 116" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="100" y="116" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="175" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">cli.py</text>
    <text x="175" y="158" text-anchor="middle" font-size="12" fill="#534AB7">명령어·옵션 정의</text>
  </g>
  <line x1="250" y1="144" x2="310" y2="144" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="310" y="116" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="395" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">commands.py</text>
    <text x="395" y="158" text-anchor="middle" font-size="12" fill="#534AB7">명령 처리·화면 출력</text>
  </g>
  <line x1="480" y1="144" x2="520" y2="144" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="520" y="116" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="580" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">constants.py</text>
    <text x="580" y="158" text-anchor="middle" font-size="12" fill="#534AB7">공용 문구</text>
  </g>

  <!-- 조립/평가 계층 (청록) -->
  <path d="M395 172 L395 200 L240 200 L240 232" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M395 172 L395 208 L480 208 L480 232" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="150" y="232" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="240" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">pipeline.py</text>
    <text x="240" y="274" text-anchor="middle" font-size="12" fill="#0F6E56">단계 조립</text>
  </g>
  <line x1="390" y1="260" x2="334" y2="260" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="390" y="232" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="480" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">evaluate.py</text>
    <text x="480" y="274" text-anchor="middle" font-size="12" fill="#0F6E56">지표 계산 (Top-1·OOD)</text>
  </g>

  <!-- 단계 구현 모듈 (산호) -->
  <line x1="240" y1="288" x2="240" y2="344" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="288" x2="480" y2="344" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="344" width="600" height="162" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="52" y="364" font-size="12" fill="#888780">단계(stage) 구현 모듈 — 서로 직접 import하지 않음</text>
  <g>
    <rect x="56" y="372" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="141" y="394" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">preprocessing.py</text>
    <text x="141" y="414" text-anchor="middle" font-size="12" fill="#993C1D">이미지 로드·crop</text>
  </g>
  <g>
    <rect x="246" y="372" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="331" y="394" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">detection.py</text>
    <text x="331" y="414" text-anchor="middle" font-size="12" fill="#993C1D">YOLO 개 탐지</text>
  </g>
  <g>
    <rect x="436" y="372" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="521" y="394" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">encoder.py</text>
    <text x="521" y="414" text-anchor="middle" font-size="12" fill="#993C1D">DINOv2 embedding</text>
  </g>
  <g>
    <rect x="160" y="440" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="245" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">prototype.py</text>
    <text x="245" y="482" text-anchor="middle" font-size="12" fill="#993C1D">견종 대표벡터 생성</text>
  </g>
  <g>
    <rect x="350" y="440" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="435" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">scoring.py</text>
    <text x="435" y="482" text-anchor="middle" font-size="12" fill="#993C1D">유사도·OOD·보정</text>
  </g>

  <!-- 유틸/호환 (회색) -->
  <line x1="141" y1="428" x2="141" y2="546" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="66" y="546" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="141" y="568" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">utils/crop.py</text>
    <text x="141" y="588" text-anchor="middle" font-size="12" fill="#5F5E5A">유일한 crop 규칙</text>
  </g>
  <line x1="530" y1="546" x2="530" y2="506" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
  <g>
    <rect x="440" y="546" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="530" y="568" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">model.py</text>
    <text x="530" y="588" text-anchor="middle" font-size="12" fill="#5F5E5A">호환용 re-export</text>
  </g>

  <text x="340" y="632" text-anchor="middle" font-size="12" fill="#888780">보라 = CLI 계층 · 청록 = 조립·평가 · 산호 = 단계 구현 · 회색 = 유틸·호환</text>
</svg>
